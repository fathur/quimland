{% for obj in object_list %}
<a class="receipt-box" href="{% url 'admin:fee_receipt_change' obj.pk %}">
  <div class="receipt-thumb"
       {% if obj.image %}data-url-endpoint="{% url 'admin:fee_receipt_url_image' obj.pk %}"{% endif %}>
    {% if obj.image %}
      <div class="receipt-placeholder receipt-placeholder--loading"></div>
      <img class="receipt-image" alt="{{ obj }}" hidden>
    {% else %}
      <div class="receipt-placeholder receipt-placeholder--empty">No image</div>
    {% endif %}
  </div>
  <div class="receipt-caption">
    <span class="receipt-caption-user">{{ obj.user|default:'—' }}</span>
    <span class="receipt-caption-date">{{ obj.created_at|date:'d M Y H:i' }}</span>
    <span class="receipt-caption-storage receipt-caption-storage--{{ obj.storage }}">{{ obj.get_storage_display }}</span>
  </div>
</a>
{% endfor %}
